<!-- Supabase → Authentication → Emails → Security notifications →
     "Password changed" (açıp bu metni yapıştır)
     Konu: Dizge — parolan değiştirildi -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f7f7f5;padding:32px 0;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;">
  <tr><td align="center">
    <table role="presentation" width="440" cellpadding="0" cellspacing="0" style="max-width:440px;background:#ffffff;border-radius:16px;padding:36px 32px;text-align:center;">
      <tr><td style="font-size:20px;font-weight:700;color:#1c1c1a;padding-bottom:8px;">Parolan değiştirildi</td></tr>
      <tr><td style="font-size:15px;line-height:1.5;color:#6b6b66;padding-bottom:16px;">
        <b>{{ .Email }}</b> hesabının parolası az önce değiştirildi.
      </td></tr>
      <tr><td style="font-size:13px;line-height:1.5;color:#8a8a84;">
        Bunu sen yaptıysan bir şey yapmana gerek yok.<br>
        Sen yapmadıysan hemen uygulamada <b>“Parolamı unuttum”</b> ile parolanı sıfırla.
      </td></tr>
    </table>
  </td></tr>
</table>
