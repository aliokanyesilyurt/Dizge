# Bu dosya, kodu statik olarak çözümleyen analyzer'ı yapılandırır.
#
# Üretim ayarı: `flutter analyze` uyarı çıkarırsa CI kırmızıya döner. Bu yüzden
# kural seti "iyi olurdu" değil, "kırılırsa gerçekten bir sorun var" mantığıyla
# seçildi.
include: package:flutter_lints/flutter.yaml

analyzer:
  # Bazı uyarıları hataya yükselt: bunlar sessizce üretime sızarsa gerçek
  # kullanıcı hatasına dönüşür.
  errors:
    # Ölü kod ve kullanılmayan import derleme boyutunu ve okunabilirliği bozar.
    unused_import: error
    unused_local_variable: error
    dead_code: error
    # `await` unutmak offline-first bir uygulamada veri kaybı demektir.
    unawaited_futures: error
    # Widget dispose edilmeden sonra context kullanmak yaygın çökme sebebi.
    use_build_context_synchronously: error
    # TODO'lar analiz çıktısını kirletmesin.
    todo: ignore

  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"

linter:
  rules:
    # --- Doğruluk ---
    always_use_package_imports: false # proje içi göreli import'lar tercih ediliyor
    avoid_dynamic_calls: true
    avoid_slow_async_io: true
    cancel_subscriptions: true # Stream aboneliği sızıntısı = pil tüketimi
    close_sinks: true
    only_throw_errors: true
    test_types_in_equals: true
    throw_in_finally: true
    unnecessary_statements: true

    # --- Flutter/performans ---
    avoid_unnecessary_containers: true
    prefer_const_constructors: true
    prefer_const_constructors_in_immutables: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true
    sized_box_for_whitespace: true
    use_colored_box: true
    use_decorated_box: true

    # --- Okunabilirlik ---
    prefer_single_quotes: true
    directives_ordering: true
    require_trailing_commas: false # el ile biçimlendirmeyi zorlaştırıyor
    unnecessary_lambdas: true
    unnecessary_parenthesis: true

    # --- Üretim hijyeni ---
    avoid_print: true # debugPrint kullan; print üretimde de çalışır
    avoid_web_libraries_in_flutter: true
